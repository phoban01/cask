\* TLC model for CrossRange. Two ranges, two keys (one per range), two
\* values, modest skew bound and time horizon. Small but exercises the
\* uncertainty window: writes that straddle [t - MaxOffset, t] are
\* unconstrained; writes outside it must round-trip.
SPECIFICATION Spec

CONSTANTS
  Range = {r1, r2}
  Key = {k1, k2}
  Value = {v1, v2}
  RangeOfKey = [k1 |-> r1, k2 |-> r2]
  MaxOffset = 2
  MaxTime = 6

INVARIANT Inv

CHECK_DEADLOCK FALSE
