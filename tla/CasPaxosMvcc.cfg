\* TLC model for CasPaxosMvcc. Small but exhaustive: 3 acceptors, 2 values,
\* ballots 0..2. This already exercises the cross-ballot carry-forward that
\* breaks naive consensus implementations.
SPECIFICATION Spec

CONSTANTS
  Acceptor = {a1, a2, a3}
  Value = {v1, v2}
  MaxBal = 2

INVARIANT Inv

CHECK_DEADLOCK FALSE
