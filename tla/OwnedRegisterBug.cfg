\* NEGATIVE CONTROL — the pre-W0 ballot rule (+1 bump into the owner's epoch
\* space). TLC MUST report a NoLostUpdate violation: the full proposer commits
\* inside the owner's epoch and the owner's next seq-bumped write wins the
\* node tiebreak (OwnerNode > FullNode) from its stale cache — a lost update.
\* A passing run of this config means the model has lost its teeth.
CONSTANTS
  Acceptor = {a1, a2, a3}
  OwnerNode = 2
  FullNode = 1
  OwnerOps = {x, y}
  FullOps = {z}
  MaxEpoch = 2
  MaxSeq = 2
  JumpRule = FALSE
SPECIFICATION Spec
INVARIANT Inv
SYMMETRY Perms
CHECK_DEADLOCK FALSE
