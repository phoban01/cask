\* TLC model for Reconfig: 5 acceptors, overlapping old/new configs (a shared
\* node plus disjoint members), 2 values. Small but exercises the joint-quorum
\* overlap that makes the transition safe.
SPECIFICATION Spec

CONSTANTS
  Acceptor = {a1, a2, a3, a4, a5}
  Value = {v1, v2}
  Cold = {a1, a2, a3}
  Cnew = {a3, a4, a5}

INVARIANT Inv

CHECK_DEADLOCK FALSE
