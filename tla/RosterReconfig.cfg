\* TLC model for RosterReconfig: 5 nodes, overlapping old/new cores (a shared
\* node plus disjoint members, as a real churn-minimising reconfiguration), and
\* membership versions 0..2 so the value advances DURING the core handoff.
SPECIFICATION Spec

CONSTANTS
  Node = {n1, n2, n3, n4, n5}
  Cold = {n1, n2, n3}
  Cnew = {n3, n4, n5}
  MaxVer = 2

INVARIANT Inv

CHECK_DEADLOCK FALSE
