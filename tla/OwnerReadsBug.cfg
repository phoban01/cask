\* NEGATIVE CONTROL — naive lapsed-checks on both sides (no MaxOffset margin).
\* TLC MUST report a NoStaleRead violation: a fast-clocked successor takes
\* over and writes while the slow-clocked old owner's lease still looks live
\* to it, and it serves its stale cache. A passing run of this config means
\* the model has lost its teeth.
CONSTANTS
  Client = {c1, c2}
  NoClient = NoClient
  Skew = 2
  TTL = 5
  MaxTime = 14
  MaxWrites = 2
  Guarded = FALSE
SPECIFICATION Spec
INVARIANT Inv
CHECK_DEADLOCK FALSE
