# The fleet.cask.dev extension apiserver for ONE member cluster.
#
# cask is EMBEDDED: each apiserver carries its own cask acceptor
# (--listen-consensus) and the fleet's apiservers form the consensus group
# among themselves — there are no external cask processes anywhere.
#
# hostNetwork: pod networks are not routable between kind clusters, but the
# kind nodes all sit on the shared "kind" docker network, so the consensus
# port rides the node IP. The pod learns that IP from the downward API.
#
# demo.sh substitutes __CLUSTER__ (this cluster's name), __ID__ (a unique
# proposer id per apiserver), __CASK_PEERS__ (every member's node
# IP:8001, including this one's), and the three __CONSENSUS_*__ values
# (base64 PEM: the fleet CA and this member's certificate and key).
apiVersion: v1
kind: Namespace
metadata:
  name: cask-system
---
# The consensus identity of this member. Consensus traffic between the
# apiservers runs mutual TLS: each one presents this certificate and
# accepts only peers whose certificate the same fleet CA signed.
apiVersion: v1
kind: Secret
metadata:
  name: cask-consensus-tls
  namespace: cask-system
type: Opaque
data:
  ca.crt: __CONSENSUS_CA__
  tls.crt: __CONSENSUS_CERT__
  tls.key: __CONSENSUS_KEY__
---
# A StatefulSet, not a Deployment: each voter keeps its acceptor state on
# its own PersistentVolumeClaim. The claim outlives the pod, so the state
# survives a restart, a reschedule, and a scale to zero (the zombie act
# depends on this). kind's default local-path StorageClass provisions it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cask-apiserver
  namespace: cask-system
  labels: {app: cask-apiserver}
spec:
  serviceName: cask-apiserver
  replicas: 1
  selector:
    matchLabels: {app: cask-apiserver}
  template:
    metadata:
      labels: {app: cask-apiserver}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: apiserver
          image: cask-demo:latest
          imagePullPolicy: Never # loaded via `kind load docker-image`
          command: ["/usr/local/bin/cask-apiserver"]
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: {fieldPath: status.hostIP}
          args:
            - --listen=:9443
            - --cluster=__CLUSTER__
            - --id=__ID__
            - --listen-consensus=:8001
            - --advertise-consensus=$(HOST_IP):8001
            - --cask-peers=__CASK_PEERS__
            - --data-dir=/var/lib/cask
            - --self-signed-tls
            - --consensus-cert=/etc/cask/consensus/tls.crt
            - --consensus-key=/etc/cask/consensus/tls.key
            - --consensus-ca=/etc/cask/consensus/ca.crt
          ports:
            - containerPort: 9443
            - containerPort: 8001
          # Durable acceptor state: an embedded acceptor that restarted empty
          # would forget its promises, which is unsafe for consensus.
          volumeMounts:
            - name: data
              mountPath: /var/lib/cask
            - name: consensus-tls
              mountPath: /etc/cask/consensus
              readOnly: true
          readinessProbe:
            httpGet: {path: /healthz, port: 9443, scheme: HTTPS}
            initialDelaySeconds: 1
      volumes:
        - name: consensus-tls
          secret:
            secretName: cask-consensus-tls
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# A rolling upgrade must keep a majority of voters available. This budget
# lets a voluntary disruption, such as a node drain, take at most one voter
# in this cluster at a time. The demo runs one voter per cluster, so the
# budget does not coordinate across clusters: upgrade one cluster at a
# time and wait for its voter to be Ready before the next.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cask-apiserver
  namespace: cask-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: cask-apiserver}
---
apiVersion: v1
kind: Service
metadata:
  name: cask-apiserver
  namespace: cask-system
spec:
  selector: {app: cask-apiserver}
  ports:
    - port: 443
      targetPort: 9443
---
# Registers the group with THIS cluster's kube-apiserver: from here,
# `kubectl get devices` anywhere in the fleet reads the same cask registers.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.fleet.cask.dev
spec:
  group: fleet.cask.dev
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  insecureSkipTLSVerify: true # demo: the backend serves a self-signed cert
  service:
    name: cask-apiserver
    namespace: cask-system
    port: 443
