# The fleet.cask.dev extension apiserver for ONE member cluster.
# demo.sh substitutes __CLUSTER__ (this cluster's name), __ID__ (a unique
# proposer id per apiserver), and __CASK_PEERS__ (the shared cask fleet's
# consensus addresses on the kind docker network).
apiVersion: v1
kind: Namespace
metadata:
  name: cask-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cask-apiserver
  namespace: cask-system
  labels: {app: cask-apiserver}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cask-apiserver}
  template:
    metadata:
      labels: {app: cask-apiserver}
    spec:
      containers:
        - name: apiserver
          image: cask-demo:latest
          imagePullPolicy: Never # loaded via `kind load docker-image`
          command: ["/usr/local/bin/cask-apiserver"]
          args:
            - --listen=:9443
            - --cluster=__CLUSTER__
            - --id=__ID__
            - --cask-peers=__CASK_PEERS__
            - --self-signed-tls
          ports:
            - containerPort: 9443
          readinessProbe:
            httpGet: {path: /healthz, port: 9443, scheme: HTTPS}
            initialDelaySeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: cask-apiserver
  namespace: cask-system
spec:
  selector: {app: cask-apiserver}
  ports:
    - port: 443
      targetPort: 9443
---
# Registers the group with THIS cluster's kube-apiserver: from here,
# `kubectl get devices` anywhere in the fleet reads the same cask registers.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.fleet.cask.dev
spec:
  group: fleet.cask.dev
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  insecureSkipTLSVerify: true # demo: the backend serves a self-signed cert
  service:
    name: cask-apiserver
    namespace: cask-system
    port: 443
