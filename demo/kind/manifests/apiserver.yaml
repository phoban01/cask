# The fleet.cask.dev extension apiserver for ONE member cluster.
#
# cask is EMBEDDED: each apiserver carries its own cask acceptor
# (--listen-consensus) and the fleet's apiservers form the consensus group
# among themselves — there are no external cask processes anywhere.
#
# hostNetwork: pod networks are not routable between kind clusters, but the
# kind nodes all sit on the shared "kind" docker network, so the consensus
# port rides the node IP. The pod learns that IP from the downward API.
#
# demo.sh substitutes __CLUSTER__ (this cluster's name), __ID__ (a unique
# proposer id per apiserver), __CASK_PEERS__ (every member's node
# IP:8001, including this one's), the three __CONSENSUS_*__ values
# (base64 PEM: the fleet CA and this member's certificate and key), and the
# three __SERVING_*__ values (base64 PEM: this cluster's serving CA and the
# serving certificate and key of the apiserver).
apiVersion: v1
kind: Namespace
metadata:
  name: cask-system
---
# The consensus identity of this member. Consensus traffic between the
# apiservers runs mutual TLS: each one presents this certificate and
# accepts only peers whose certificate the same fleet CA signed.
apiVersion: v1
kind: Secret
metadata:
  name: cask-consensus-tls
  namespace: cask-system
type: Opaque
data:
  ca.crt: __CONSENSUS_CA__
  tls.crt: __CONSENSUS_CERT__
  tls.key: __CONSENSUS_KEY__
---
# The serving identity of this apiserver. The certificate names the
# Service (cask-apiserver.cask-system.svc). The APIService below carries
# the serving CA as its caBundle, so the kube-apiserver verifies the
# apiserver before it proxies a request.
apiVersion: v1
kind: Secret
metadata:
  name: cask-serving-tls
  namespace: cask-system
type: kubernetes.io/tls
data:
  tls.crt: __SERVING_CERT__
  tls.key: __SERVING_KEY__
---
# The identity of the apiserver toward the kube-apiserver of this cluster.
# The apiserver delegates authentication and authorization of each request
# for the group to the kube-apiserver, with TokenReview and
# SubjectAccessReview.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cask-apiserver
  namespace: cask-system
---
# system:auth-delegator allows TokenReview and SubjectAccessReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cask-apiserver:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: cask-apiserver
    namespace: cask-system
---
# The extension-apiserver-authentication ConfigMap holds the CA of the
# aggregation front proxy and the client CA of the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cask-apiserver:auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: cask-apiserver
    namespace: cask-system
---
# The generic server watches namespaces, admission configuration, and
# priority and fairness configuration, as every aggregated apiserver does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cask-apiserver
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [flowcontrol.apiserver.k8s.io]
    resources: [prioritylevelconfigurations, flowschemas]
    verbs: [get, list, watch]
  - apiGroups: [flowcontrol.apiserver.k8s.io]
    resources: [prioritylevelconfigurations/status, flowschemas/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cask-apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cask-apiserver
subjects:
  - kind: ServiceAccount
    name: cask-apiserver
    namespace: cask-system
---
# A StatefulSet, not a Deployment: each voter keeps its acceptor state on
# its own PersistentVolumeClaim. The claim outlives the pod, so the state
# survives a restart, a reschedule, and a scale to zero (the zombie act
# depends on this). kind's default local-path StorageClass provisions it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cask-apiserver
  namespace: cask-system
  labels: {app: cask-apiserver}
spec:
  serviceName: cask-apiserver
  replicas: 1
  selector:
    matchLabels: {app: cask-apiserver}
  template:
    metadata:
      labels: {app: cask-apiserver}
    spec:
      serviceAccountName: cask-apiserver
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: apiserver
          image: cask-demo:latest
          imagePullPolicy: Never # loaded via `kind load docker-image`
          command: ["/usr/local/bin/cask-apiserver"]
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: {fieldPath: status.hostIP}
          args:
            - --secure-port=9443
            - --cluster=__CLUSTER__
            - --id=__ID__
            - --listen-consensus=:8001
            - --advertise-consensus=$(HOST_IP):8001
            - --cask-peers=__CASK_PEERS__
            - --data-dir=/var/lib/cask
            - --consensus-cert=/etc/cask/consensus/tls.crt
            - --consensus-key=/etc/cask/consensus/tls.key
            - --consensus-ca=/etc/cask/consensus/ca.crt
            - --tls-cert-file=/etc/cask/serving/tls.crt
            - --tls-private-key-file=/etc/cask/serving/tls.key
          ports:
            - containerPort: 9443
            - containerPort: 8001
          # Durable acceptor state: an embedded acceptor that restarted empty
          # would forget its promises, which is unsafe for consensus.
          volumeMounts:
            - name: data
              mountPath: /var/lib/cask
            - name: consensus-tls
              mountPath: /etc/cask/consensus
              readOnly: true
            - name: serving-tls
              mountPath: /etc/cask/serving
              readOnly: true
          readinessProbe:
            httpGet: {path: /readyz, port: 9443, scheme: HTTPS}
            initialDelaySeconds: 1
      volumes:
        - name: consensus-tls
          secret:
            secretName: cask-consensus-tls
            defaultMode: 0400
        - name: serving-tls
          secret:
            secretName: cask-serving-tls
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# A rolling upgrade must keep a majority of voters available. This budget
# lets a voluntary disruption, such as a node drain, take at most one voter
# in this cluster at a time. The demo runs one voter per cluster, so the
# budget does not coordinate across clusters: upgrade one cluster at a
# time and wait for its voter to be Ready before the next. See
# docs/runbooks/rolling-upgrade.md.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cask-apiserver
  namespace: cask-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: cask-apiserver}
---
apiVersion: v1
kind: Service
metadata:
  name: cask-apiserver
  namespace: cask-system
spec:
  selector: {app: cask-apiserver}
  ports:
    - port: 443
      targetPort: 9443
---
# Registers the group with THIS cluster's kube-apiserver: from here,
# `kubectl get devices` anywhere in the fleet reads the same cask registers.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.fleet.cask.dev
spec:
  group: fleet.cask.dev
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  # The kube-apiserver verifies the serving certificate with this CA.
  caBundle: __SERVING_CA__
  service:
    name: cask-apiserver
    namespace: cask-system
    port: 443
