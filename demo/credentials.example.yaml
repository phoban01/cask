# cask demo — cloud credentials
#
# Copy to `credentials.yaml` (gitignored) and fill in. These let the demo talk to
# each cloud non-interactively; creds.sh loads them into per-CLI env overrides
# without touching your global gcloud/aws/oci config. NEVER commit the filled file
# or the key material it points at (keep keys under demo/secrets/, also gitignored).
#
# EASIEST PATH: authenticate each CLI once in the browser, then fill ONLY the ids
# below and leave the key fields blank — creds.sh uses your ambient CLI auth:
#   GCP:  gcloud auth login && gcloud config set project <id>
#   OCI:  oci setup bootstrap          (browser auth; auto-creates+uploads the key)
#   AWS:  aws configure                (after creating one IAM access key)
# The explicit key fields are the portable/CI option — required only if you don't
# want to rely on ambient auth.

gcp:
  project: my-gcp-project-id            # REQUIRED
  # Optional: service-account key JSON (role: Compute Admin), path rel. to demo/.
  # Leave blank to use your `gcloud auth login` session.
  service_account_key: ""

oci:
  compartment: ocid1.compartment.oc1..aaaaaaaa   # REQUIRED
  region: us-ashburn-1                            # REQUIRED
  subnet: ""                            # optional: reuse an existing public subnet OCID
  # Optional api-key auth (else ambient ~/.oci/config from `oci setup bootstrap`):
  tenancy: ""
  user: ""
  fingerprint: ""
  key_file: ""                          # API signing private key, path rel. to demo/

aws:
  region: us-east-1                     # REQUIRED
  # Optional explicit keys (else ambient ~/.aws/credentials from `aws configure`):
  access_key_id: ""
  secret_access_key: ""
