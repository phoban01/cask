# cask demo — cloud credentials
#
# Copy to `credentials.yaml` (gitignored) and fill in. These let the demo talk to
# each cloud non-interactively; creds.sh loads them into per-CLI env overrides
# without touching your global gcloud/aws/oci config. NEVER commit the filled file
# or the key material it points at (keep keys under demo/secrets/, also gitignored).
#
# Any platform you leave blank falls back to your ambient CLI auth (e.g. an existing
# `gcloud auth login` / `aws configure` / `~/.oci/config`).

gcp:
  project: my-gcp-project-id
  # Service-account key JSON (role: Compute Admin). Path relative to demo/ or absolute.
  # Leave blank to use your existing `gcloud auth login` session.
  service_account_key: secrets/gcp-sa.json

oci:
  tenancy: ocid1.tenancy.oc1..aaaaaaaa
  user: ocid1.user.oc1..aaaaaaaa
  fingerprint: "aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99"
  key_file: secrets/oci_api_key.pem      # API signing private key (path rel. to demo/)
  region: us-ashburn-1
  compartment: ocid1.compartment.oc1..aaaaaaaa
  subnet: ""                             # optional: reuse an existing public subnet OCID

aws:
  access_key_id: AKIAEXAMPLE
  secret_access_key: wJalrXUtnFEMI_EXAMPLE_KEY
  region: us-east-1
