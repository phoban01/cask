name: verify

# The verification gates docs/spec/fleet.md §10 requires:
#   go     unit tests with the race detector, in the root module and in
#          the cmd/cask-apiserver module
#   quint  typecheck, witness runs, simulation and negative controls,
#          plus bounded Apalache verification per module (see below)
#   duvet  requirement coverage; the committed snapshot makes a drop fail
# The simulator gate has its own workflow (sim-gate.yml).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/cask-apiserver/go.sum
      - name: gofmt
        # Walks both modules. A Duvet citation must sit inside a function
        # body, where gofmt leaves it alone.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"; echo "$unformatted"; exit 1
          fi
      # cmd/cask-apiserver is its own module. A root "./..." does not
      # reach it, so build and test each module.
      - run: go build ./...
      - run: go -C cmd/cask-apiserver build ./...
      #= docs/spec/fleet.md#10-verification
      ## CI MUST run the unit tests with the race detector.
      - run: go test -race ./...
      - run: go -C cmd/cask-apiserver test -race ./...

  # The Quint gate is three jobs. quint-checks runs typecheck, witness
  # runs, simulation and negative controls for every module. quint-verify
  # runs bounded Apalache verification in parallel jobs: one per module,
  # or per invariant or per init where a module header asks, so a slow
  # module does not push the others past the timeout. quint is the
  # required check and passes only when both pass.
  quint-modules:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      # One verify job per module, or per invariant (verify-split=each)
      # or per init (verify-init) as each module's header asks.
      - id: list
        run: echo "jobs=$(scripts/quint-check.sh --verify-jobs)" >> "$GITHUB_OUTPUT"

  quint-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-quint
      - run: scripts/quint-check.sh

  quint-verify:
    needs: quint-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.quint-modules.outputs.jobs) }}
    name: quint-verify (${{ matrix.module }}${{ matrix.invariants && format(' {0}', matrix.invariants) || '' }}${{ matrix.init && format(' {0}', matrix.init) || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-quint
      - run: >-
          scripts/quint-check.sh --verify-only --module "${{ matrix.module }}"
          ${{ matrix.invariants && format('--invariants {0}', matrix.invariants) || '' }}
          ${{ matrix.init && format('--init {0}', matrix.init) || '' }}

  quint:
    needs: [quint-checks, quint-verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "quint-checks: ${{ needs.quint-checks.result }}"
          echo "quint-verify: ${{ needs.quint-verify.result }}"
          [ "${{ needs.quint-checks.result }}" = success ] && [ "${{ needs.quint-verify.result }}" = success ]

  duvet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/duvet
          key: duvet-${{ runner.os }}-v1
      - run: command -v duvet || cargo install duvet --locked
      - run: duvet extract -f markdown docs/spec/fleet.md -o docs/spec
      - run: git diff --exit-code docs/spec/fleet
      #= docs/spec/fleet.md#10-verification
      ## A change that lowers Duvet coverage MUST fail CI.
      - run: duvet report --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duvet-report
          path: .duvet/reports/report.html
