name: verify

# The verification gates docs/spec/fleet.md §10 requires:
#   go     unit tests with the race detector
#   quint  typecheck, witness runs, simulation, negative controls, and
#          bounded Apalache verification (needs x86_64 for Apalache's Z3)
#   duvet  requirement coverage; the committed snapshot makes a drop fail
# The simulator gate has its own workflow (sim-gate.yml).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      #= docs/spec/fleet.md#10-verification
      ## CI MUST run the unit tests with the race detector.
      - run: go test -race ./...

  quint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g @informalsystems/quint@0.32.0
      # The Quint CLI looks up its Rust evaluator through the GitHub API
      # without a token, so shared runners hit the rate limit. Cache
      # ~/.quint, and on a miss fetch the evaluator with the job token.
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-0.32.0
      - name: Fetch the Quint evaluator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -o "QUINT_EVALUATOR_VERSION = '[^']*'" \
            "$(npm root -g)/@informalsystems/quint/dist/src/rust/binaryManager.js" | cut -d"'" -f2)
          d="$HOME/.quint/rust-evaluator-$v"
          if [ ! -x "$d/quint_evaluator" ]; then
            mkdir -p "$d"
            gh release download "evaluator/$v" -R informalsystems/quint \
              -p quint_evaluator-x86_64-unknown-linux-gnu.tar.gz -O - | tar -xz -C "$d"
            chmod +x "$d/quint_evaluator"
          fi
          "$d/quint_evaluator" --version || true
      - run: scripts/quint-check.sh --verify

  duvet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/duvet
          key: duvet-${{ runner.os }}-v1
      - run: command -v duvet || cargo install duvet --locked
      - run: duvet extract -f markdown docs/spec/fleet.md -o docs/spec
      - run: git diff --exit-code docs/spec/fleet
      #= docs/spec/fleet.md#10-verification
      ## A change that lowers Duvet coverage MUST fail CI.
      - run: duvet report --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duvet-report
          path: .duvet/reports/report.html
